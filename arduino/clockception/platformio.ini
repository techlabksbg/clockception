[env:nanolgt328p]
platform = lgt8f   ; https://github.com/darkautism/pio-lgt8fx?utm_source=platformio&utm_medium=piohome
board = LGT8F328P
framework = arduino
monitor_speed = 115200



[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200


[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
